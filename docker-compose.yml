version: '3.8'

services:
  sciagent:
    build: .
    command: ["node", "dist/app/cli.js", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.cache:/app/.cache
    env_file:
      - .env
    environment:
      - SCIAGENT_CONFIG=/app/config.yaml
      - SCIAGENT_PYTHON=python3
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - neo4j

  # MCP over Streamable HTTP at http://localhost:8001/mcp, opt-in:
  # `docker compose --profile mcp up`. Shares the corpus volume with the web server.
  mcp:
    build: .
    profiles: ["mcp"]
    command: ["node", "dist/app/cli.js", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.cache:/app/.cache
    env_file:
      - .env
    environment:
      - SCIAGENT_CONFIG=/app/config.yaml
      - SCIAGENT_PYTHON=python3
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - neo4j

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
