apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: research-agent-data
  namespace: research-agent
spec:
  # One MCP replica writes traces and may extend the corpus. Use RWX storage before
  # increasing replicas or split indexing into a separate job.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: research-agent-mcp
  namespace: research-agent
spec:
  selector:
    app: research-agent-mcp
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-agent-mcp
  namespace: research-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: research-agent-mcp
  template:
    metadata:
      labels:
        app: research-agent-mcp
    spec:
      containers:
        - name: mcp-server
          image: ghcr.io/your-org/research-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/app/cli.js", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: NEO4J_URI
              value: bolt://neo4j:7687
            - name: NEO4J_USERNAME
              value: neo4j
            - name: NEO4J_DATABASE
              value: neo4j
          envFrom:
            - secretRef:
                name: research-agent-secrets
          volumeMounts:
            - name: corpus
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 6Gi
      volumes:
        - name: corpus
          persistentVolumeClaim:
            claimName: research-agent-data
